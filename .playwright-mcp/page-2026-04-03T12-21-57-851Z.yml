          - heading "Introducing Composer 2" [level=1] [ref=e49]
          - generic [ref=e50]: 3 min read
        - generic [ref=e53]:
          - generic [ref=e54]:
            - paragraph [ref=e55]: Composer 2 is now available in Cursor.
            - paragraph [ref=e56]:
              - text: It's frontier-level at coding and priced at $0.50/M input and $2.50/M output tokens, making it a new, optimal combination of intelligence and cost. We also released a
              - link "technical report" [ref=e57] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2603.24477
              - text: on how we trained it.
            - figure [ref=e58]:
              - img "Composer 2 efficiency and quality on CursorBench" [ref=e60]
            - heading "Link to this section Frontier-level coding intelligence" [level=2] [ref=e61]:
              - link "Link to this section" [ref=e62] [cursor=pointer]:
                - /url: "#frontier-level-coding-intelligence"
                - text: "#"
              - text: Frontier-level coding intelligence
            - paragraph [ref=e63]:
              - text: We're rapidly improving the quality of our model. Composer 2 delivers large improvements on all
              - link "benchmarks we measure" [ref=e64] [cursor=pointer]:
                - /url: /blog/cursorbench
              - text: ", including Terminal-Bench 2.0"
              - superscript [ref=e65]:
                - link "1" [ref=e66] [cursor=pointer]:
                  - /url: "#fn-1"
              - text: "and SWE-bench Multilingual:"
            - figure [ref=e67]:
              - img "Composer 2 Terminal-Bench 2.0 results" [ref=e69]
            - table [ref=e71]:
              - rowgroup [ref=e72]:
                - row "Model CursorBench Terminal-Bench 2.0 SWE-bench Multilingual" [ref=e73]:
                  - columnheader "Model" [ref=e74]
                  - columnheader "CursorBench" [ref=e75]
                  - columnheader "Terminal-Bench 2.0" [ref=e76]
                  - columnheader "SWE-bench Multilingual" [ref=e77]
              - rowgroup [ref=e78]:
                - row "Composer 2 61.3 61.7 73.7" [ref=e79]:
                  - cell "Composer 2" [ref=e80]
                  - cell "61.3" [ref=e81]
                  - cell "61.7" [ref=e82]
                  - cell "73.7" [ref=e83]
                - row "Composer 1.5 44.2 47.9 65.9" [ref=e84]:
                  - cell "Composer 1.5" [ref=e85]
                  - cell "44.2" [ref=e86]
                  - cell "47.9" [ref=e87]
                  - cell "65.9" [ref=e88]
                - row "Composer 1 38.0 40.0 56.9" [ref=e89]:
                  - cell "Composer 1" [ref=e90]
                  - cell "38.0" [ref=e91]
                  - cell "40.0" [ref=e92]
                  - cell "56.9" [ref=e93]
            - paragraph [ref=e94]: These quality improvements come from our first continued pretraining run, which provides a far stronger base to scale our reinforcement learning.
            - paragraph [ref=e95]:
              - text: From this base, we train on
              - link "long-horizon" [ref=e96] [cursor=pointer]:
                - /url: /blog/self-driving-codebases
              - text: coding tasks through
              - link "reinforcement learning" [ref=e97] [cursor=pointer]:
                - /url: /blog/self-summarization
              - text: . Composer 2 is able to solve challenging tasks requiring hundreds of actions.
            - heading "Link to this section Try Composer 2" [level=2] [ref=e98]:
              - link "Link to this section" [ref=e99] [cursor=pointer]:
                - /url: "#try-composer-2"
                - text: "#"
              - text: Try Composer 2
            - paragraph [ref=e100]: Composer 2 is priced at $0.50/M input and $2.50/M output tokens.
            - paragraph [ref=e101]:
              - text: There is also a
              - strong [ref=e102]: faster variant with the same intelligence
              - text: at $1.50/M input and $7.50/M output tokens, which has a lower cost than other fast models
              - superscript [ref=e103]:
                - link "2" [ref=e104] [cursor=pointer]:
                  - /url: "#fn-2"
              - text: . We're making fast the default option. See our
              - link "model docs" [ref=e105] [cursor=pointer]:
                - /url: /docs/models/cursor-composer-2
              - text: for full details.
            - figure [ref=e106]:
              - img "Composer 2 fast variant speed and cost compared to other models" [ref=e108]
            - paragraph [ref=e109]:
              - text: On individual plans, Composer usage is part of a
              - link "standalone usage pool" [ref=e110] [cursor=pointer]:
                - /url: https://cursor.com/docs/models-and-pricing#usage-pools
              - text: with generous usage included. Try Composer 2 today in Cursor or in the early alpha of our
              - link "new interface" [ref=e111] [cursor=pointer]:
                - /url: https://cursor.com/glass
              - text: . ■
            - generic [ref=e112]:
              - separator [ref=e113]
              - list [ref=e114]:
                - listitem [ref=e115]:
                  - generic [ref=e116]:
                    - text: Terminal-Bench 2.0 is an agent evaluation benchmark for terminal use maintained by the Laude Institute. Anthropic model scores use the Claude Code harness and OpenAI model scores use the Simple Codex harness. Our Cursor score was computed using the official
                    - link "Harbor evaluation framework" [ref=e117] [cursor=pointer]:
                      - /url: https://github.com/laude-institute/harbor
                    - text: (the designated harness for Terminal-Bench 2.0) with default benchmark settings. We ran 5 iterations per model-agent pair and report the average. More details on the benchmark can be found at the official
                    - link "Terminal Bench website" [ref=e118] [cursor=pointer]:
                      - /url: https://www.tbench.ai/
                    - text: . For other models besides Composer 2, we took the max score between the
                    - link "official leaderboard" [ref=e119] [cursor=pointer]:
                      - /url: https://www.tbench.ai/leaderboard/terminal-bench/2.0
                    - text: score and the score recorded running in our infrastructure.
                    - link "↩" [ref=e120] [cursor=pointer]:
                      - /url: "#fnref-1"
                - listitem [ref=e121]:
                  - generic [ref=e122]:
                    - text: Tokens per second (TPS) for all models are from a snapshot of Cursor traffic on March 18th, 2026. Token sizing for Composer and GPT models are similar. Anthropic tokens are ~15% smaller and the TPS number is normalized to reflect that. Similarly, output token price for non-Anthropic models was scaled to match the same ~15% change. Speed may vary depending on provider capacity and improvements over time.
                    - link "↩" [ref=e123] [cursor=pointer]:
                      - /url: "#fnref-2"
