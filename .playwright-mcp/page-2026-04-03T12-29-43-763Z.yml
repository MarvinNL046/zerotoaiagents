                  - paragraph [ref=e421]: ‍
                  - paragraph [ref=e422]: Excalidraw is an open-source virtual whiteboard application with a hand-drawn style. It's designed for creating diagrams, wireframes, and collaborative drawings.
                  - paragraph [ref=e423]: ‍
                  - paragraph [ref=e424]: "## Purpose"
                  - paragraph [ref=e425]: "- Web-based drawing tool with infinite canvas"
                  - paragraph [ref=e426]: "- Hand-drawn aesthetic with support for shapes, arrows, text"
                  - paragraph [ref=e427]: "- End-to-end encrypted collaboration"
                  - paragraph [ref=e428]: "- Works offline as a PWA (Progressive Web App)"
                  - paragraph [ref=e429]: ‍
                  - paragraph [ref=e430]: "## Architecture"
                  - paragraph [ref=e431]: "The project is organized as a monorepo with these main components:"
                  - paragraph [ref=e432]: ‍
                  - paragraph [ref=e433]: 1. Core Package (packages/excalidraw)
                  - paragraph [ref=e434]: "- React component library for embedding Excalidraw in any application"
                  - paragraph [ref=e435]: "- Handles drawing, rendering, and core functionality"
                  - paragraph [ref=e436]: "- Uses roughjs for the hand-drawn style"
                  - paragraph [ref=e437]: "- Includes export capabilities (PNG, SVG)"
                  - paragraph [ref=e438]: ‍
                  - paragraph [ref=e439]: 2. Web Application (excalidraw-app/)
                  - paragraph [ref=e440]: "- Full-featured web app at excalidraw.com"
                  - paragraph [ref=e441]: "- Built on top of the core package"
                  - paragraph [ref=e442]: "- Adds collaboration features, local storage, sharing"
                  - paragraph [ref=e443]: ‍
                  - paragraph [ref=e444]: 3. Support Packages
                  - paragraph [ref=e445]: "- common - Shared utilities and constants"
                  - paragraph [ref=e446]: "- element - Element manipulation and type definitions"
                  - paragraph [ref=e447]: "- math - Mathematical functions for drawing"
                  - paragraph [ref=e448]: "- utils - General utility functions"
                  - paragraph [ref=e449]: ‍
                  - paragraph [ref=e450]: 4. Examples
                  - paragraph [ref=e451]: "- Integration examples (Next.js, browser script)"
                  - paragraph [ref=e452]: "- Shows how to embed Excalidraw in different environments"
                  - paragraph [ref=e453]: ‍
                  - paragraph [ref=e454]: 5. Documentation (dev-docs/)
                  - paragraph [ref=e455]: "- API documentation"
                  - paragraph [ref=e456]: "- Integration guides"
                  - paragraph [ref=e457]: "- Component documentation"
                  - paragraph [ref=e458]: ‍
                  - paragraph [ref=e459]: "## Key Features"
                  - paragraph [ref=e460]: "- Real-time collaboration with end-to-end encryption"
                  - paragraph [ref=e461]: "- Export to various formats (PNG, SVG, JSON)"
                  - paragraph [ref=e462]: "- Customizable drawing tools (rectangle, circle, arrows, freehand)"
                  - paragraph [ref=e463]: "- Dark mode support"
                  - paragraph [ref=e464]: "- Localization"
                  - paragraph [ref=e465]: "- Library of shapes and components"
                  - paragraph [ref=e466]: "- Arrow bindings and labels"
                  - paragraph [ref=e467]: "- Image support"
                  - paragraph [ref=e468]: ‍
                  - paragraph [ref=e469]: "## Technology Stack"
                  - paragraph [ref=e470]: "- React for UI"
                  - paragraph [ref=e471]: "- TypeScript for type safety"
                  - paragraph [ref=e472]: "- Firebase for collaboration backend"
                  - paragraph [ref=e473]: "- Jotai for state management"
